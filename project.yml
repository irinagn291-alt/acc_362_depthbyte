name: Depthbyte
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    CLANG_ENABLE_MODULES: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: 1,2
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: 'YES'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_TESTABILITY: 'NO'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ''
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Depthbyte:
    type: application
    platform: iOS
    sources:
    - DepthbyteApp.swift
    - Curriculum.swift
    - Substation.swift
    - DiveLab.swift
    - Instruments.swift
    - Assets.xcassets
    - AppDelegate.swift
    - APIConfig.swift
    - Black
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Depthbyte
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.0'
        PRODUCT_BUNDLE_IDENTIFIER: app.depthbyte.divelab
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTS_MACCATALYST: 'NO'
        INFOPLIST_KEY_NSCameraUsageDescription: Use the camera to take a photo or video to attach to a form.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use the microphone to record sound in a video you attach to a form.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos or videos from your library to attach to a form.
    dependencies: []
  DepthbyteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - DiveTests.swift
    - Curriculum.swift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: 'YES'
        MARKETING_VERSION: '1.0'
        PRODUCT_BUNDLE_IDENTIFIER: app.depthbyte.divelab.uitests
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTS_MACCATALYST: 'NO'
        TEST_TARGET_NAME: Depthbyte
    dependencies:
    - target: Depthbyte
schemes:
  Depthbyte:
    build:
      targets:
        Depthbyte: all
    test:
      targets:
      - DepthbyteUITests
